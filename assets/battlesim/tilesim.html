<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battles -- Regiment Hex Wargame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font:11px/1.4 'Consolas','Courier New',monospace}
h1{font-size:13px;padding:7px 14px;background:#f0ece4;color:#222;border-bottom:2px solid #333;letter-spacing:.12em;text-transform:uppercase}
h1 span{color:#666;font-size:10px;margin-left:14px;letter-spacing:.06em}

/* -- layout -- */
.body{display:flex;gap:12px;padding:10px 12px}
.col-map{flex:0 0 560px;position:relative}
.col-side{flex:1;min-width:300px;max-width:420px;display:flex;flex-direction:column;gap:6px}

/* -- hex grid -- */
#hex-grid{position:relative;width:540px;height:940px;margin:0 auto}

/* zone labels */
.zone{position:absolute;left:-6px;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#999;
  transform:rotate(-90deg);transform-origin:0 50%;white-space:nowrap;pointer-events:none;font-weight:700}
.zone-def{color:#b03030}
.zone-atk{color:#2050a0}
.zone-nml{color:#808000}

/* off-map art boxes */
.offmap{position:absolute;left:50%;transform:translateX(-50%);width:340px;
  display:flex;align-items:center;gap:10px;padding:5px 12px;
  border:2px solid #888;border-radius:3px;font-size:9px}
.offmap-def{top:0;background:#fce8e8;border-color:#c66;color:#611}
.offmap-atk{background:#e8e8fc;border-color:#66c;color:#116}
.offmap-sym{flex:0 0 auto;line-height:0}
.offmap-sym svg{display:block}
.offmap-info{flex:1}
.offmap-nm{font-weight:700;font-size:10px}
.offmap-det{font-size:8px;color:#555;margin-top:1px}

/* hex cells */
.hex-wrap{position:absolute}
.hex-bdr{position:absolute;inset:0;background:#333}
.hex-bdr.contested{background:#c08000}
.hex-fill{position:absolute;inset:3px}
.ter-field  {background:#d8e8a8}
.ter-hill   {background:#dcc8a0}
.ter-village{background:#c8c0d8}
.ter-forest {background:#80b858}
.ter-ridge  {background:#dcc090}

.hex-info{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.hex-id{font-size:11px;font-weight:700;color:#333;text-shadow:0 0 3px rgba(255,255,255,.8)}
.hex-ter{font-size:8px;color:#555;margin-top:1px}

/* -- units in hex -- */
.hex-units{position:absolute;bottom:6px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;z-index:5}

/* -- unit counter (milsymbol) -- */
.unit{position:relative;text-align:center;cursor:default}
.unit + .unit{margin-top:-8px}
.unit svg{display:block;margin:0 auto;pointer-events:none;max-width:100%}
.u-label{font-size:7px;line-height:1.2;background:rgba(255,255,255,.88);padding:1px 4px;border:1px solid #aaa;border-radius:2px;
  white-space:nowrap;margin-top:-2px;color:#111;font-weight:700}
.u-name{font-size:8px;color:#333;border-bottom:1px solid #ccc;margin-bottom:1px;padding-bottom:1px}
.u-rcn .u-label{border-color:#2080c0;background:rgba(220,235,255,.92)}
.u-fog{opacity:.4;filter:grayscale(.6)}
.u-fog .u-label{color:#888;border-color:#ccc}

/* scale indicator */
.map-scale{position:absolute;left:50%;transform:translateX(-50%);font-size:8px;color:#888;
  letter-spacing:.06em;text-align:center;white-space:nowrap}

/* suppression outlines */
.u-s1 .u-label{outline:2px solid #cc0;outline-offset:1px}
.u-s2 .u-label{outline:2px solid #e80;outline-offset:1px}
.u-s3 .u-label{outline:2px solid #e00;outline-offset:1px}

/* -- OOB -- */
.oob-hdr{font-size:10px;font-weight:700;padding:4px 6px;border-bottom:2px solid #333}
.oob-hdr.atk{color:#1040a0;background:#e8ecf4}
.oob-hdr.def{color:#a01010;background:#f4e8e8}
.oob-tbl{width:100%;border-collapse:collapse;font-size:9px;background:#fff}
.oob-tbl th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px 3px;
  border-bottom:2px solid #333;background:#f4f2ee}
.oob-tbl td{text-align:center;padding:2px 3px;border-bottom:1px solid #ddd}
.oob-bn{font-weight:700;text-align:left!important}
.oob-sub{padding-left:12px!important;font-size:8px;color:#2070b0}
.oob-ty{font-size:7px;color:#666;letter-spacing:.04em}
.oob-cv{color:#a06000;font-weight:700}
.oob-s{font-size:7px;color:#c06000}
.oob-h{color:#555}
.oob-unk{color:#aaa;font-style:italic;text-align:left!important}
.rt td{color:#c44;text-decoration:line-through}
.fog td{color:#aaa}
.s1 .oob-s{color:#aa8800}.s2 .oob-s{color:#cc6600}.s3 .oob-s{color:#cc0000}

/* -- log -- */
#log{height:190px;overflow-y:auto;padding:5px 8px;background:#fff;border:2px solid #333;border-radius:3px;
  font-size:10px;line-height:1.5}
.l-hdr{color:#555;font-weight:700;margin-top:4px}
.l-recon{color:#1060a0}
.l-arty{color:#a06020}
.l-combat{color:#a02020}
.l-move{color:#207820}
.l-result{color:#806000;font-weight:700}
.l-info{color:#666}

/* -- phase bar -- */
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#f4f2ee;border:2px solid #333;border-radius:3px;font-size:10px}
.bar-ph{flex:1;font-weight:700;color:#222;letter-spacing:.06em}
.bar-st{color:#888}

/* -- controls -- */
.ctrl{display:flex;gap:5px;justify-content:center}
.ctrl button{padding:5px 14px;font:700 11px/1 'Consolas','Courier New',monospace;background:#fff;color:#222;
  border:2px solid #333;cursor:pointer;border-radius:3px}
.ctrl button:hover:not(:disabled){background:#e8e4dc;color:#000}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl button.reset{border-color:#806000;color:#806000;background:#faf4e0}

/* -- progress -- */
.prog{height:4px;background:#ddd;margin:2px 0}
.prog-fill{height:100%;background:#2060a0;transition:width .15s}

/* -- results -- */
#results{background:#fff;border:2px solid #333;border-radius:4px;padding:10px;margin-top:6px}
#results.hidden{display:none}
.res-v{font-size:12px;font-weight:700;color:#806000;margin-bottom:4px}
.res-sub{font-size:9px;color:#666;margin-bottom:8px}
.res-rgt{font-size:10px;font-weight:700;margin:8px 0 3px;color:#222}
.res-t{width:100%;border-collapse:collapse;font-size:9px}
.res-t th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px;background:#f4f2ee}
.res-t td{text-align:center;padding:2px 3px;border-bottom:1px solid #ddd}
.res-lost{color:#c00;font-weight:700}
.res-tot td{font-weight:700;border-top:2px solid #333}
</style>
</head>
<body>
<h1>BATTLES <span>-- Regiment Combat | NATO Counters</span></h1>

<div class="prog"><div id="progress" class="prog-fill" style="width:0"></div></div>

<div class="body">
  <!-- MAP -->
  <div class="col-map">
    <div id="hex-grid"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="col-side">
    <div class="bar">
      <span id="phase" class="bar-ph">DEPLOY</span>
      <span id="step" class="bar-st">1 / 1</span>
    </div>

    <div class="ctrl">
      <button id="prev">PREV</button>
      <button id="next">NEXT</button>
      <button id="skip">SKIP</button>
      <button id="reset" class="reset">RESET</button>
    </div>

    <!-- OOB: Attacker -->
    <div class="oob-hdr atk">394th Infantry Rgt (Attacker)</div>
    <table class="oob-tbl">
      <thead><tr><th>Unit</th><th>Type</th><th>Men</th><th>MG</th><th>Mor</th><th>CV</th><th>M</th><th>Status</th><th>Ent</th><th>Hex</th></tr></thead>
      <tbody id="oob-a"></tbody>
    </table>

    <!-- OOB: Defender -->
    <div class="oob-hdr def">1028th Rifle Rgt (Defender)</div>
    <table class="oob-tbl">
      <thead><tr><th>Unit</th><th>Type</th><th>Men</th><th>MG</th><th>Mor</th><th>CV</th><th>M</th><th>Status</th><th>Ent</th><th>Hex</th></tr></thead>
      <tbody id="oob-d"></tbody>
    </table>

    <div id="log"></div>

    <div id="results" class="hidden"></div>
  </div>
</div>

<script src="milsymbol.js"></script>
<script src="tilesim.js"></script>
</body>
</html>
