<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battles — Regiment Hex Wargame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;color:#d0d0d0;font:11px/1.4 'Courier New',monospace;overflow-x:hidden}
h1{font-size:13px;padding:6px 12px;background:#111;border-bottom:1px solid #333;color:#c0c0c0;letter-spacing:.1em;text-transform:uppercase}
h1 span{color:#666;font-size:10px;margin-left:12px}

/* ── layout ── */
.body{display:flex;gap:10px;padding:8px 10px}
.col-map{flex:0 0 460px;position:relative}
.col-side{flex:1;min-width:280px;max-width:380px;display:flex;flex-direction:column;gap:6px}

/* ── hex grid ── */
#hex-grid{position:relative;width:420px;height:570px;margin:0 auto}

/* zone labels */
.zone{position:absolute;left:-4px;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#555;transform:rotate(-90deg);transform-origin:0 50%;white-space:nowrap;pointer-events:none}
.zone-def{color:#8a4444}
.zone-atk{color:#44648a}
.zone-nml{color:#6a6a3a}

/* off-map art boxes */
.offmap{position:absolute;left:50%;transform:translateX(-50%);width:310px;height:28px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  border:1px solid #444;border-radius:3px;font-size:9px}
.offmap-def{top:0;background:#301818;border-color:#6a3030;color:#cca0a0}
.offmap-atk{background:#182038;border-color:#304a6a;color:#a0b8cc}
.offmap-lbl{font-size:7px;color:#888;letter-spacing:.08em;text-transform:uppercase}
.offmap-nm{font-weight:700;flex:1}
.offmap-guns{font-weight:700;color:#cc6}

/* hex */
.hex-wrap{position:absolute}
.hex-bdr{position:absolute;inset:0;background:#444}
.hex-bdr.contested{background:#886622}
.hex-fill{position:absolute;inset:3px}
.ter-field  {background:#2a3a20}
.ter-hill   {background:#3a3028}
.ter-village{background:#2a2830}
.ter-forest {background:#1a3018}
.ter-ridge  {background:#383228}

.hex-info{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.hex-id{font-size:10px;font-weight:700;color:#aaa;text-shadow:0 0 3px #000}
.hex-ter{font-size:7px;color:#888;margin-top:1px}

/* ── units in hex (overflow allowed) ── */
.hex-units{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;z-index:5}

/* ── counters (wargame style) ── */
.ctr{width:72px;border:2px solid;font-size:8px;cursor:default;position:relative;border-radius:2px}
.ctr + .ctr{margin-top:-8px}
.ctr-b{background:#1a2844;border-color:#3060aa;color:#b0c8e8}
.ctr-r{background:#3a1818;border-color:#903030;color:#dab0b0}
.ctr-fog{background:#2a2a2a;border-color:#555;color:#888}

.ctr-hd{display:flex;justify-content:space-between;align-items:center;padding:1px 3px;
  background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;font-size:7px}
.ctr-sym{font-size:11px;line-height:1}
.ctr-nm{text-align:center;font-weight:700;padding:1px 0;font-size:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.ctr-row{display:flex;justify-content:space-between;padding:0 3px;font-size:8px}
.ctr-men{font-weight:700}
.ctr-fpv{color:#cc6;font-weight:700}
.ctr-eq{font-size:7px;opacity:.85;padding-bottom:1px}
.ctr-dig{text-align:center;font-size:6px;font-weight:700;color:#cc6;background:rgba(80,100,40,.5);
  border-top:1px solid rgba(255,255,255,.1);padding:0 2px}

/* suppression rings */
.ctr-s1{box-shadow:0 0 0 2px #cc6 inset}
.ctr-s2{box-shadow:0 0 0 2px #e80 inset}
.ctr-s3{box-shadow:0 0 0 2px #e00 inset}

/* entrenchment marker */
.ctr-ent{border-style:double}

/* ── OOB ── */
.oob-hdr{font-size:10px;font-weight:700;padding:3px 4px;background:#222;border-bottom:1px solid #333}
.oob-hdr.atk{color:#7090c0}.oob-hdr.def{color:#c07070}
.oob-tbl{width:100%;border-collapse:collapse;font-size:9px}
.oob-tbl th{font-size:7px;text-transform:uppercase;color:#666;text-align:center;padding:2px 3px;border-bottom:1px solid #333}
.oob-tbl td{text-align:center;padding:2px 3px;border-bottom:1px solid #222}
.oob-bn{font-weight:700;text-align:left !important}
.oob-fp{color:#cc6;font-weight:700}
.oob-s{font-size:7px;color:#e80}
.oob-h{color:#888}
.oob-unk{color:#555;font-style:italic;text-align:left !important}
.rt td{color:#a44;text-decoration:line-through}
.fog td{color:#666}
.s1 .oob-s{color:#cc6}.s2 .oob-s{color:#e80}.s3 .oob-s{color:#e00}

/* ── log ── */
#log{height:180px;overflow-y:auto;padding:4px 6px;background:#111;border:1px solid #333;border-radius:3px;
  font-size:10px;line-height:1.5}
.l-hdr{color:#888;font-weight:700;margin-top:4px}
.l-recon{color:#6a9aca}
.l-arty{color:#cc8844}
.l-combat{color:#cc6666}
.l-move{color:#77aa55}
.l-result{color:#ccaa00;font-weight:700}
.l-info{color:#999}

/* ── phase bar ── */
.bar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#111;border:1px solid #333;border-radius:3px;font-size:10px}
.bar-ph{flex:1;font-weight:700;color:#aaa;letter-spacing:.05em}
.bar-st{color:#666}

/* ── controls ── */
.ctrl{display:flex;gap:4px;justify-content:center}
.ctrl button{padding:4px 12px;font:700 11px/1 'Courier New',monospace;background:#222;color:#ccc;border:1px solid #444;cursor:pointer;border-radius:3px}
.ctrl button:hover:not(:disabled){background:#333;color:#fff}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl button.reset{border-color:#665500;color:#cc6}

/* ── progress ── */
.prog{height:3px;background:#222;border-radius:2px;margin:2px 0}
.prog-fill{height:100%;background:#5588cc;border-radius:2px;transition:width .15s}

/* ── results ── */
#results{background:#111;border:1px solid #444;border-radius:4px;padding:8px;margin-top:6px}
#results.hidden{display:none}
.res-v{font-size:12px;font-weight:700;color:#ccaa00;margin-bottom:4px}
.res-sub{font-size:9px;color:#888;margin-bottom:8px}
.res-rgt{font-size:10px;font-weight:700;margin:6px 0 2px;color:#aaa}
.res-t{width:100%;border-collapse:collapse;font-size:9px}
.res-t th{font-size:7px;text-transform:uppercase;color:#666;text-align:center;padding:2px}
.res-t td{text-align:center;padding:2px 3px;border-bottom:1px solid #222}
.res-lost{color:#e44;font-weight:700}
.res-tot td{font-weight:700;border-top:1px solid #555}
</style>
</head>
<body>
<h1>⚔ BATTLES <span>— Regiment Combat · 5-Row Hex Grid</span></h1>

<div class="prog"><div id="progress" class="prog-fill" style="width:0"></div></div>

<div class="body">
  <!-- MAP -->
  <div class="col-map">
    <div id="hex-grid"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="col-side">
    <div class="bar">
      <span id="phase" class="bar-ph">DEPLOY</span>
      <span id="step" class="bar-st">1 / 1</span>
    </div>

    <div class="ctrl">
      <button id="prev">◄</button>
      <button id="next">►</button>
      <button id="skip">▸▸</button>
      <button id="reset" class="reset">⟳</button>
    </div>

    <!-- OOB: Attacker -->
    <div class="oob-hdr atk">394th Infantry Rgt (Attacker ↑)</div>
    <table class="oob-tbl">
      <thead><tr><th>Bn</th><th>Men</th><th>MG</th><th>Mor</th><th>⚔</th><th>M</th><th>Status</th><th>⚒</th><th>Hex</th></tr></thead>
      <tbody id="oob-a"></tbody>
    </table>

    <!-- OOB: Defender -->
    <div class="oob-hdr def">1028th Rifle Rgt (Defender)</div>
    <table class="oob-tbl">
      <thead><tr><th>Bn</th><th>Men</th><th>MG</th><th>Mor</th><th>⚔</th><th>M</th><th>Status</th><th>⚒</th><th>Hex</th></tr></thead>
      <tbody id="oob-d"></tbody>
    </table>

    <div id="log"></div>

    <div id="results" class="hidden"></div>
  </div>
</div>

<script src="tilesim.js"></script>
</body>
</html>
