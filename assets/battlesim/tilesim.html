<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battles -- Regiment Hex Wargame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#181c20;color:#c8ccd0;font:11px/1.4 'Consolas','Courier New',monospace;overflow-x:hidden}
h1{font-size:13px;padding:7px 14px;background:#0e1114;border-bottom:1px solid #2a2e32;color:#b0b4b8;letter-spacing:.12em;text-transform:uppercase}
h1 span{color:#606468;font-size:10px;margin-left:14px;letter-spacing:.06em}

/* -- layout -- */
.body{display:flex;gap:12px;padding:10px 12px}
.col-map{flex:0 0 500px;position:relative}
.col-side{flex:1;min-width:300px;max-width:420px;display:flex;flex-direction:column;gap:6px}

/* -- hex grid -- */
#hex-grid{position:relative;width:460px;height:600px;margin:0 auto}

/* zone labels */
.zone{position:absolute;left:-6px;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#444;
  transform:rotate(-90deg);transform-origin:0 50%;white-space:nowrap;pointer-events:none;font-weight:700}
.zone-def{color:#7a3a3a}
.zone-atk{color:#3a5a7a}
.zone-nml{color:#5a5a30}

/* off-map art boxes */
.offmap{position:absolute;left:50%;transform:translateX(-50%);width:340px;
  display:flex;align-items:center;gap:10px;padding:4px 12px;
  border:1px solid #333;border-radius:3px;font-size:9px}
.offmap-def{top:0;background:#281414;border-color:#5a2828;color:#c0a0a0}
.offmap-atk{background:#141828;border-color:#28405a;color:#a0b0c0}
.offmap-sym{flex:0 0 auto;line-height:0}
.offmap-sym svg{display:block}
.offmap-info{flex:1}
.offmap-nm{font-weight:700;font-size:10px}
.offmap-det{font-size:8px;color:#888;margin-top:1px}

/* hex cells */
.hex-wrap{position:absolute}
.hex-bdr{position:absolute;inset:0;background:#383c40}
.hex-bdr.contested{background:#7a6020}
.hex-fill{position:absolute;inset:3px}
.ter-field  {background:#2a3420}
.ter-hill   {background:#3a3228}
.ter-village{background:#2c2832}
.ter-forest {background:#1c3018}
.ter-ridge  {background:#38322a}

.hex-info{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.hex-id{font-size:11px;font-weight:700;color:#999;text-shadow:0 1px 2px #000}
.hex-ter{font-size:8px;color:#666;margin-top:1px}

/* -- units in hex -- */
.hex-units{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;z-index:5}

/* -- unit counter (milsymbol) -- */
.unit{position:relative;text-align:center;cursor:default}
.unit + .unit{margin-top:-6px}
.unit svg{display:block;margin:0 auto;pointer-events:none}
.u-label{font-size:7px;line-height:1.2;background:rgba(0,0,0,.65);padding:1px 4px;border-radius:2px;
  white-space:nowrap;margin-top:-2px;color:#ccc;font-weight:700}
.u-type{font-size:6px;color:#8ab;text-align:center;letter-spacing:.06em;margin-top:-1px}
.u-fog{opacity:.45;filter:grayscale(.5)}
.u-fog .u-label{color:#888}

/* suppression outlines */
.u-s1 .u-label{outline:1px solid #cc8;outline-offset:1px}
.u-s2 .u-label{outline:1px solid #e80;outline-offset:1px}
.u-s3 .u-label{outline:1px solid #e44;outline-offset:1px}

/* -- OOB -- */
.oob-hdr{font-size:10px;font-weight:700;padding:4px 6px;background:#1a1e22;border-bottom:1px solid #2a2e32}
.oob-hdr.atk{color:#6888b0}.oob-hdr.def{color:#b06868}
.oob-tbl{width:100%;border-collapse:collapse;font-size:9px}
.oob-tbl th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px 3px;border-bottom:1px solid #2a2e32}
.oob-tbl td{text-align:center;padding:2px 3px;border-bottom:1px solid #1e2226}
.oob-bn{font-weight:700;text-align:left!important}
.oob-sub{padding-left:12px!important;font-size:8px;color:#8ab}
.oob-ty{font-size:7px;color:#888;letter-spacing:.04em}
.oob-cv{color:#ca4;font-weight:700}
.oob-s{font-size:7px;color:#e80}
.oob-h{color:#777}
.oob-unk{color:#444;font-style:italic;text-align:left!important}
.rt td{color:#944;text-decoration:line-through}
.fog td{color:#555}
.s1 .oob-s{color:#cc8}.s2 .oob-s{color:#e80}.s3 .oob-s{color:#e44}

/* -- log -- */
#log{height:190px;overflow-y:auto;padding:5px 8px;background:#0e1114;border:1px solid #2a2e32;border-radius:3px;
  font-size:10px;line-height:1.5}
.l-hdr{color:#707478;font-weight:700;margin-top:4px}
.l-recon{color:#6090b0}
.l-arty{color:#b08040}
.l-combat{color:#b05050}
.l-move{color:#60a040}
.l-result{color:#c0a020;font-weight:700}
.l-info{color:#808488}

/* -- phase bar -- */
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#0e1114;border:1px solid #2a2e32;border-radius:3px;font-size:10px}
.bar-ph{flex:1;font-weight:700;color:#a0a4a8;letter-spacing:.06em}
.bar-st{color:#606468}

/* -- controls -- */
.ctrl{display:flex;gap:5px;justify-content:center}
.ctrl button{padding:5px 14px;font:700 11px/1 'Consolas','Courier New',monospace;background:#1a1e22;color:#b0b4b8;
  border:1px solid #333;cursor:pointer;border-radius:3px;transition:background .1s}
.ctrl button:hover:not(:disabled){background:#282c30;color:#e0e4e8}
.ctrl button:disabled{opacity:.25;cursor:default}
.ctrl button.reset{border-color:#5a5020;color:#c0a020}

/* -- progress -- */
.prog{height:3px;background:#1a1e22;border-radius:2px;margin:2px 0}
.prog-fill{height:100%;background:#4878a8;border-radius:2px;transition:width .15s}

/* -- results -- */
#results{background:#0e1114;border:1px solid #333;border-radius:4px;padding:10px;margin-top:6px}
#results.hidden{display:none}
.res-v{font-size:12px;font-weight:700;color:#c0a020;margin-bottom:4px}
.res-sub{font-size:9px;color:#707478;margin-bottom:8px}
.res-rgt{font-size:10px;font-weight:700;margin:8px 0 3px;color:#a0a4a8}
.res-t{width:100%;border-collapse:collapse;font-size:9px}
.res-t th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px}
.res-t td{text-align:center;padding:2px 3px;border-bottom:1px solid #1e2226}
.res-lost{color:#c44;font-weight:700}
.res-tot td{font-weight:700;border-top:1px solid #444}
</style>
</head>
<body>
<h1>BATTLES <span>-- Regiment Combat | milsymbol NATO Counters</span></h1>

<div class="prog"><div id="progress" class="prog-fill" style="width:0"></div></div>

<div class="body">
  <!-- MAP -->
  <div class="col-map">
    <div id="hex-grid"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="col-side">
    <div class="bar">
      <span id="phase" class="bar-ph">DEPLOY</span>
      <span id="step" class="bar-st">1 / 1</span>
    </div>

    <div class="ctrl">
      <button id="prev">PREV</button>
      <button id="next">NEXT</button>
      <button id="skip">SKIP</button>
      <button id="reset" class="reset">RESET</button>
    </div>

    <!-- OOB: Attacker -->
    <div class="oob-hdr atk">394th Infantry Rgt (Attacker)</div>
    <table class="oob-tbl">
      <thead><tr><th>Unit</th><th>Type</th><th>Men</th><th>MG</th><th>Mor</th><th>CV</th><th>M</th><th>Status</th><th>Ent</th><th>Hex</th></tr></thead>
      <tbody id="oob-a"></tbody>
    </table>

    <!-- OOB: Defender -->
    <div class="oob-hdr def">1028th Rifle Rgt (Defender)</div>
    <table class="oob-tbl">
      <thead><tr><th>Unit</th><th>Type</th><th>Men</th><th>MG</th><th>Mor</th><th>CV</th><th>M</th><th>Status</th><th>Ent</th><th>Hex</th></tr></thead>
      <tbody id="oob-d"></tbody>
    </table>

    <div id="log"></div>

    <div id="results" class="hidden"></div>
  </div>
</div>

<script src="https://unpkg.com/milsymbol@2.2.0/dist/milsymbol.js"></script>
<script src="tilesim.js"></script>
</body>
</html>
