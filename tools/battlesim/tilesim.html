<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battles -- Regiment Hex Wargame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#111;font:11px/1.4 'Consolas','Courier New',monospace}
h1{font-size:13px;padding:7px 14px;background:#f0ece4;color:#222;border-bottom:2px solid #333;letter-spacing:.12em;text-transform:uppercase}
h1 span{color:#666;font-size:10px;margin-left:14px;letter-spacing:.06em}

/* -- layout -- */
.body{display:flex;gap:12px;padding:10px 12px}
.col-map{flex:0 0 340px;position:relative}
.col-mid{flex:0 0 340px;display:flex;flex-direction:column;gap:6px}
.col-log{flex:1;min-width:240px;max-width:320px;display:flex;flex-direction:column;gap:6px}

/* -- hex grid -- */
#hex-grid{position:relative;width:310px;height:720px;margin:0 auto}

/* zone labels — row-letter descriptions on the LEFT of the grid */
.zone{position:absolute;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#999;
  white-space:nowrap;pointer-events:none;font-weight:700;text-align:left}
.zone-row{font-size:8px;text-align:right;padding-right:8px}
.zone-def{color:#b03030}
.zone-atk{color:#2050a0}
.zone-nml{color:#808000}

/* off-map art boxes */
.offmap{position:absolute;left:50%;transform:translateX(-50%);width:280px;
  display:flex;align-items:center;gap:10px;padding:5px 12px;
  border:2px solid #888;border-radius:3px;font-size:9px}
.offmap-def{top:0;background:#fce8e8;border-color:#c66;color:#611}
.offmap-atk{background:#e8e8fc;border-color:#66c;color:#116}
.offmap-sym{flex:0 0 auto;line-height:0}
.offmap-sym svg{display:block}
.offmap-info{flex:1}
.offmap-nm{font-weight:700;font-size:10px}
.offmap-det{font-size:8px;color:#555;margin-top:1px}

/* hex cells */
.hex-wrap{position:absolute}
.hex-bdr{position:absolute;inset:0;background:#333}
.hex-bdr.own-atk{background:#3060c0}
.hex-bdr.own-def{background:#c03030}
.hex-bdr.own-neu{background:#555}
.hex-bdr.contested{background:#c08000}
.hex-fill{position:absolute;inset:3px}
.hex-fill.hex-fog{opacity:.92}
.ter-field  {background:#d8e8a8}
.ter-hill   {background:#dcc8a0}
.ter-village{background:#c8c0d8}
.ter-forest {background:#80b858}
.ter-ridge  {background:#dcc090}

.hex-info{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.hex-id{font-size:11px;font-weight:700;color:#333;text-shadow:0 0 3px rgba(255,255,255,.8)}
.hex-ter{font-size:8px;color:#555;margin-top:1px}

.hex-edge{opacity:.4;pointer-events:none}

/* -- objective markers -- */
.hex-obj{position:absolute;top:2px;right:2px;font-size:6px;font-weight:700;color:#1040a0;
  background:rgba(200,220,255,.85);padding:1px 3px;border-radius:2px;border:1px solid #3060c0;
  z-index:15;pointer-events:none;white-space:nowrap;letter-spacing:.04em}
.hex-obj.obj-done{background:rgba(200,255,200,.85);color:#206020;border-color:#40a040}

/* -- units in hex -- */
.hex-units{position:absolute;inset:0;z-index:5;pointer-events:none}

/* -- unit counter (milsymbol) stacked counter-game style -- */
.unit{position:absolute;left:50%;bottom:6px;
  transform:translate(calc(-50% + (var(--sx,0) * 5px)), calc(var(--sx,0) * -5px));
  text-align:center;cursor:default;pointer-events:auto;
  background:rgba(255,255,255,.55);padding:1px;border-radius:2px;
  box-shadow:2px 2px 4px rgba(0,0,0,.35)}
.unit svg{display:block;margin:0 auto;pointer-events:none;max-width:100%}
.u-label{font-size:6px;line-height:1.1;background:rgba(255,255,255,.88);padding:1px 3px;border:1px solid #aaa;border-radius:2px;
  white-space:nowrap;margin-top:-2px;color:#111;font-weight:700}
.u-name{font-size:6px;color:#333;border-bottom:1px solid #ccc;margin-bottom:1px;padding-bottom:1px}
.u-act{font-size:5px;color:#555;font-style:italic;margin-top:1px;letter-spacing:.03em}
.u-rcn .u-label{border-color:#2080c0;background:rgba(220,235,255,.92)}
.u-fog{opacity:.4;filter:grayscale(.6)}
.u-fog .u-label{color:#888;border-color:#ccc}

/* scale indicator */
.map-scale{position:absolute;left:50%;transform:translateX(-50%);font-size:8px;color:#888;
  letter-spacing:.06em;text-align:center;white-space:nowrap}

/* suppression outlines */
.u-s1 .u-label{outline:2px solid #cc0;outline-offset:1px}
.u-s2 .u-label{outline:2px solid #e80;outline-offset:1px}
.u-s3 .u-label{outline:2px solid #e00;outline-offset:1px}

/* -- OOB -- */
.oob-hdr{font-size:10px;font-weight:700;padding:4px 6px;border-bottom:2px solid #333}
.oob-hdr.atk{color:#1040a0;background:#e8ecf4}
.oob-hdr.def{color:#a01010;background:#f4e8e8}
.oob-tbl{width:100%;border-collapse:collapse;font-size:9px;background:#fff}
.oob-tbl th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px 3px;
  border-bottom:2px solid #333;background:#f4f2ee}
.oob-tbl td{text-align:center;padding:2px 3px;border-bottom:1px solid #ddd}
.oob-bn{font-weight:700;text-align:left!important}
.oob-sub{padding-left:12px!important;font-size:8px;color:#2070b0}
.oob-ty{font-size:7px;color:#666;letter-spacing:.04em}
.oob-cv{color:#a06000;font-weight:700}
.oob-act{font-size:7px;color:#555;font-style:italic;text-align:center;max-width:50px}
.oob-s{font-size:7px;color:#c06000}
.oob-h{color:#555}
.oob-unk{color:#aaa;font-style:italic;text-align:left!important}
.rt td{color:#c44;text-decoration:line-through}
.fog td{color:#aaa}
.s1 .oob-s{color:#aa8800}.s2 .oob-s{color:#cc6600}.s3 .oob-s{color:#cc0000}

/* -- log -- */
#log{flex:1;min-height:200px;overflow-y:auto;padding:5px 8px;background:#fff;border:2px solid #333;border-radius:3px;
  font-size:10px;line-height:1.5}
#turn-log{max-height:160px;overflow-y:auto;padding:5px 8px;background:#fdf8f0;border:2px solid #a08040;border-radius:3px;
  font-size:9px;line-height:1.4}
.tl-empty{color:#aaa;font-style:italic;font-size:9px}
.log-hdr{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#555;padding:3px 0}
.l-hdr{color:#555;font-weight:700;margin-top:4px}
.l-recon{color:#1060a0}
.l-arty{color:#a06020}
.l-combat{color:#a02020}
.l-move{color:#207820}
.l-result{color:#806000;font-weight:700}
.l-info{color:#666}

/* -- phase bar -- */
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#f4f2ee;border:2px solid #333;border-radius:3px;font-size:10px}
.bar-ph{flex:1;font-weight:700;color:#222;letter-spacing:.06em}
.bar-st{color:#888}

/* -- controls -- */
.ctrl{display:flex;gap:5px;justify-content:center}
.ctrl button{padding:5px 14px;font:700 11px/1 'Consolas','Courier New',monospace;background:#fff;color:#222;
  border:2px solid #333;cursor:pointer;border-radius:3px}
.ctrl button:hover:not(:disabled){background:#e8e4dc;color:#000}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl button.reset{border-color:#806000;color:#806000;background:#faf4e0}
.view-btn{font-weight:700!important;letter-spacing:.06em}
.view-btn.view-atk{border-color:#2050a0!important;color:#fff!important;background:#2050a0!important}
.view-btn.view-def{border-color:#b03030!important;color:#fff!important;background:#b03030!important}

/* -- tile-outline legend -- */
.legend{display:flex;gap:14px;justify-content:center;padding:6px 4px;font-size:9px;color:#444;flex-wrap:wrap;
  background:#fafaf6;border:1px solid #ccc;border-radius:3px;margin-top:6px}
.lg-item{display:inline-flex;align-items:center;gap:4px}
.lg-sq{display:inline-block;width:14px;height:10px;background:#fff;border:3px solid;border-radius:1px}
.lg-sq.atk{border-color:#3060c0}
.lg-sq.def{border-color:#c03030}
.lg-sq.neu{border-color:#555}
.lg-sq.cnt{border-color:#c08000}
.lg-ter{display:inline-block;width:14px;height:10px;border:1px solid #888;border-radius:1px}

/* -- tile inspector panel -- */
#tile-panel{background:#fff;border:2px solid #333;border-radius:3px;padding:7px 9px;margin-top:6px;font-size:10px;display:none}
#tile-panel.open{display:block}
.tp-hdr{font-weight:700;letter-spacing:.08em;font-size:11px;color:#222;margin-bottom:5px;border-bottom:2px solid #333;padding-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.tp-hdr .tp-close{cursor:pointer;font-size:10px;color:#888;font-weight:400;padding:0 2px}
.tp-hdr .tp-close:hover{color:#c00}
.tp-terrain{font-size:9px;color:#555;margin-bottom:6px}
.tp-terrain b{color:#222}
.tp-section{font-size:8px;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:.08em;margin:5px 0 2px}
.tp-unit{display:flex;align-items:flex-start;gap:5px;padding:3px 0;border-bottom:1px solid #eee}
.tp-unit:last-child{border-bottom:none}
.tp-unit-sym{flex:0 0 28px}
.tp-unit-body{flex:1;font-size:9px;line-height:1.4}
.tp-unit-name{font-weight:700;color:#111}
.tp-unit-name.routed{color:#c44;text-decoration:line-through}
.tp-unit-stats{color:#555}
.tp-unit-status{font-size:8px;color:#a06000;font-weight:700}
.tp-unit-act{font-size:7px;color:#555;font-style:italic;margin-top:1px}
.tp-fog{color:#aaa;font-style:italic;font-size:9px}
.tp-owner{display:inline-block;padding:1px 5px;border-radius:2px;font-size:8px;font-weight:700;margin-bottom:4px}
.tp-owner.own-atk{background:#d0dff5;color:#204080}
.tp-owner.own-def{background:#f5d0d0;color:#802020}
.tp-owner.own-neu{background:#eee;color:#555}

.prog-fill{height:100%;background:#2060a0;transition:width .15s}

/* -- results -- */
#results{background:#fff;border:2px solid #333;border-radius:4px;padding:10px;margin-top:6px}
#results.hidden{display:none}
.res-v{font-size:12px;font-weight:700;color:#806000;margin-bottom:4px}
.res-sub{font-size:9px;color:#666;margin-bottom:8px}
.res-rgt{font-size:10px;font-weight:700;margin:8px 0 3px;color:#222}
.res-t{width:100%;border-collapse:collapse;font-size:9px}
.res-t th{font-size:7px;text-transform:uppercase;color:#555;text-align:center;padding:2px;background:#f4f2ee}
.res-t td{text-align:center;padding:2px 3px;border-bottom:1px solid #ddd}
.res-lost{color:#c00;font-weight:700}
.res-tot td{font-weight:700;border-top:2px solid #333}
</style>
</head>
<body>
<h1>BATTLES <span>-- Regiment Combat | NATO Counters | 1 hex ≈ 1 km | 4×8 grid</span></h1>

<div class="prog"><div id="progress" class="prog-fill" style="width:0"></div></div>

<div class="body">
  <!-- MAP -->
  <div class="col-map">
    <div id="hex-grid"></div>
    <div class="legend">
      <span class="lg-item"><span class="lg-sq atk"></span>Attacker tile</span>
      <span class="lg-item"><span class="lg-sq def"></span>Defender tile</span>
      <span class="lg-item"><span class="lg-sq neu"></span>Neutral</span>
      <span class="lg-item"><span class="lg-sq cnt"></span>Contested</span>
      <span class="lg-item"><span class="lg-ter" style="background:#80b858"></span>Forest (2 cos)</span>
      <span class="lg-item"><span class="lg-ter" style="background:#dcc090"></span>Ridge (2 cos)</span>
      <span class="lg-item"><span class="lg-ter" style="background:#d8e8a8"></span>Field (1 co)</span>
    </div>
  </div>

  <!-- OOB + CONTROLS -->
  <div class="col-mid">
    <div class="bar">
      <span id="phase" class="bar-ph">DEPLOY</span>
      <span id="step" class="bar-st">1 / 1</span>
    </div>

    <div class="ctrl">
      <button id="prev">PREV</button>
      <button id="next">NEXT</button>
      <button id="skip">SKIP</button>
      <button id="view-toggle" class="view-btn view-atk">VIEW: BLUE</button>
      <button id="reset" class="reset">RESET</button>
    </div>

    <!-- OOB: side-by-side attacker + defender -->
    <div style="display:flex;gap:6px">
      <div style="flex:1;min-width:0;overflow-x:auto">
        <div class="oob-hdr atk">394th (Attacker)</div>
        <table class="oob-tbl">
          <thead><tr><th>Unit</th><th>Men</th><th>CV</th><th>M</th><th>Hex</th><th>Act</th><th>OBJ</th></tr></thead>
          <tbody id="oob-a"></tbody>
        </table>
      </div>
      <div style="flex:1;min-width:0;overflow-x:auto">
        <div class="oob-hdr def">1028th (Defender)</div>
        <table class="oob-tbl">
          <thead><tr><th>Unit</th><th>Men</th><th>CV</th><th>M</th><th>Hex</th><th>Act</th><th>OBJ</th></tr></thead>
          <tbody id="oob-d"></tbody>
        </table>
      </div>
    </div>

    <!-- Tile inspector -->
    <div id="tile-panel">
      <div class="tp-hdr"><span id="tp-title">Hex</span><span class="tp-close" id="tp-close">[x]</span></div>
      <div id="tp-body"></div>
    </div>

    <div class="log-hdr">TURN EVENTS</div>
    <div id="turn-log"></div>

    <div id="results" class="hidden"></div>
  </div>

  <!-- FULL LOG -->
  <div class="col-log">
    <div class="log-hdr">TURN LOG</div>
    <div id="log"></div>
  </div>
</div>

<script src="milsymbol.js"></script>
<script src="tilesim.js"></script>
</body>
</html>
